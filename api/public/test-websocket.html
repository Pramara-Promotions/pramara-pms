<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Debug Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .log { margin: 5px 0; padding: 5px; background: #2a2a2a; border-radius: 3px; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        .warning { color: #fbbf24; }
        .info { color: #60a5fa; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Debug Test</h1>
    <div>
        <button onclick="testConnection()">Test Connection</button>
        <button onclick="clearLogs()">Clear Logs</button>
        <button onclick="location.reload()">Reload</button>
    </div>
    <div id="status" style="font-size: 18px; margin: 20px 0;">Status: <span id="statusText">Not Started</span></div>
    <div id="logs"></div>
    
    <script>
        const logsDiv = document.getElementById('logs');
        const statusText = document.getElementById('statusText');
        
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${time}] ${msg}`;
            logsDiv.appendChild(div);
            console.log(msg);
        }
        
        function setStatus(text, type = 'info') {
            statusText.textContent = text;
            statusText.className = type;
        }
        
        function clearLogs() {
            logsDiv.innerHTML = '';
        }
        
        function testConnection() {
            clearLogs();
            setStatus('Testing...', 'warning');
            
            // Check cookies
            log('📋 Checking cookies...', 'info');
            log('All cookies: ' + document.cookie, 'info');
            
            const token = document.cookie
                .split('; ')
                .find(row => row.startsWith('token='))
                ?.split('=')[1];
            
            if (!token) {
                log('❌ No token cookie found!', 'error');
                log('⚠️ You need to login first at http://localhost:5173', 'warning');
                setStatus('No token found', 'error');
                return;
            }
            
            log('✅ Token found: ' + token.substring(0, 30) + '...', 'success');
            log('Token length: ' + token.length, 'info');
            
            // Test Socket.IO connection
            log('🔌 Connecting to http://localhost:4000...', 'info');
            
            const socket = io('http://localhost:4000', {
                auth: { token },
                transports: ['websocket', 'polling'],
                withCredentials: true
            });
            
            socket.on('connect', () => {
                log('✅ Socket.IO connected! ID: ' + socket.id, 'success');
                setStatus('Connected ✅', 'success');
            });
            
            socket.on('connect_error', (error) => {
                log('❌ Connection error: ' + error.message, 'error');
                log('Error details: ' + JSON.stringify(error, null, 2), 'error');
                setStatus('Connection failed ❌', 'error');
            });
            
            socket.on('disconnect', (reason) => {
                log('🔌 Disconnected: ' + reason, 'warning');
                setStatus('Disconnected', 'warning');
            });
            
            socket.on('notification', (data) => {
                log('📬 Received notification: ' + JSON.stringify(data, null, 2), 'success');
            });
            
            // Test after 5 seconds
            setTimeout(() => {
                if (!socket.connected) {
                    log('⏰ 5 seconds passed, still not connected', 'error');
                    log('Check backend console for auth errors', 'warning');
                } else {
                    log('✅ Still connected after 5 seconds', 'success');
                }
            }, 5000);
        }
        
        // Auto-test on load
        log('🚀 Page loaded', 'info');
        log('Click "Test Connection" to start', 'info');
    </script>
</body>
</html>
