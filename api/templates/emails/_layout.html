<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{subject}}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .email-wrapper {
      max-width: 600px;
      margin: 20px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    .email-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      padding: 30px;
      text-align: center;
    }
    .email-header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 600;
    }
    .email-body {
      padding: 40px 30px;
    }
    .email-body h2 {
      color: #333;
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .email-body p {
      margin: 16px 0;
      color: #555;
    }
    .button {
      display: inline-block;
      padding: 12px 30px;
      background-color: #667eea;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 5px;
      margin: 20px 0;
      font-weight: 600;
    }
    .button:hover {
      background-color: #5568d3;
    }
    .alert {
      padding: 15px;
      margin: 20px 0;
      border-radius: 5px;
      border-left: 4px solid;
    }
    .alert-info {
      background-color: #e3f2fd;
      border-color: #2196f3;
      color: #1976d2;
    }
    .alert-warning {
      background-color: #fff3cd;
      border-color: #ffc107;
      color: #856404;
    }
    .alert-danger {
      background-color: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
    }
    .alert-success {
      background-color: #d4edda;
      border-color: #28a745;
      color: #155724;
    }
    .email-footer {
      background-color: #f8f9fa;
      padding: 20px 30px;
      text-align: center;
      font-size: 12px;
      color: #6c757d;
      border-top: 1px solid #e9ecef;
    }
    .email-footer a {
      color: #667eea;
      text-decoration: none;
    }
    code {
      background-color: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    ul {
      margin: 16px 0;
      padding-left: 20px;
    }
    ul li {
      margin: 8px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="email-wrapper">
    <div class="email-header">
      <h1>Pramara PMS</h1>
    </div>
    <div class="email-body">
      {{content}}
    </div>
    <div class="email-footer">
      <p>
        This is an automated message from <strong>Pramara PMS</strong>.<br>
        If you have any questions, please contact <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>
      </p>
      <p>
        &copy; {{currentYear}} Pramara Promotions. All rights reserved.
      </p>
    </div>
  </div>
</body>
</html>
