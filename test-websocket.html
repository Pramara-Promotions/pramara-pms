<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Connection Test</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div id="status">Testing...</div>
    <div id="logs" style="margin-top: 20px; font-family: monospace; white-space: pre;"></div>
    
    <script>
        const logs = document.getElementById('logs');
        const status = document.getElementById('status');
        
        function log(msg) {
            console.log(msg);
            logs.textContent += msg + '\n';
        }
        
        // Check for cookies
        log('Cookies: ' + document.cookie);
        
        // Get token from cookie
        const token = document.cookie
            .split('; ')
            .find(row => row.startsWith('token='))
            ?.split('=')[1];
        
        log('Token found: ' + (token ? 'YES (' + token.substring(0, 20) + '...)' : 'NO'));
        
        if (!token) {
            status.textContent = '❌ No token cookie found - need to login first';
            status.style.color = 'red';
            log('\n⚠️ You need to login first to get a token cookie');
            log('Go to http://localhost:5173 and login, then come back here');
        } else {
            status.textContent = '🔄 Connecting to WebSocket...';
            status.style.color = 'orange';
            
            const socket = io('http://localhost:4000', {
                auth: { token },
                transports: ['websocket', 'polling']
            });
            
            socket.on('connect', () => {
                log('✅ WebSocket connected!');
                status.textContent = '✅ Connected';
                status.style.color = 'green';
            });
            
            socket.on('connect_error', (error) => {
                log('❌ Connection error: ' + error.message);
                status.textContent = '❌ Connection failed';
                status.style.color = 'red';
            });
            
            socket.on('notification', (data) => {
                log('📬 Received notification: ' + JSON.stringify(data, null, 2));
            });
            
            socket.on('disconnect', () => {
                log('🔌 Disconnected');
                status.textContent = '🔌 Disconnected';
                status.style.color = 'gray';
            });
        }
    </script>
</body>
</html>
